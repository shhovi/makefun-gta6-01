<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Bay: Outlaw</title>
<style>
  html,body{margin:0;padding:0;background:#0b1020;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  #game{display:block;margin:0 auto;background:#1a7f4b}
  #hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
  #stars{font-size:22px;color:#ffd23f;text-shadow:0 1px 2px #000}
  #stats{font-size:14px;text-shadow:0 1px 2px #000}
  #minimap{position:fixed;right:8px;bottom:8px;border:2px solid #fff;background:#123}
  #mission{position:fixed;left:8px;bottom:8px;max-width:420px;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:6px;font-size:14px}
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.72);text-align:center;z-index:10}
  .screen.on{display:flex}
  .screen h1{font-size:44px;margin:0 0 10px}
  .screen p{margin:4px 0;color:#ddd}
  button{pointer-events:auto;font-size:16px;padding:8px 18px;border-radius:6px;border:0;background:#ffd23f;cursor:pointer}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="hud">
  <div id="stats">Health: 100 &nbsp; Money: $0</div>
  <div id="stars"></div>
</div>
<canvas id="minimap" width="150" height="150"></canvas>
<div id="mission">Mara Voss: Welcome to Solar Bay. Press K to save.</div>
<div id="title" class="screen on">
  <h1>Solar Bay: Outlaw</h1>
  <p>WASD / arrows to move &middot; E enter car &middot; F punch &middot; mouse to shoot</p>
  <p><button id="startBtn">Start</button></p>
</div>
<div id="pause" class="screen"><h1>Paused</h1><p>Press Esc to resume</p></div>
<div id="busted" class="screen"><h1>BUSTED</h1><p>The Solar Bay police got you.</p><p><button data-restart>Respawn</button></p></div>
<div id="wasted" class="screen"><h1>WASTED</h1><p>You did not make it.</p><p><button data-restart>Respawn</button></p></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
