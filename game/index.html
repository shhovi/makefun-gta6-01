<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Bay: Outlaw</title>
<style>
  html, body { margin: 0; padding: 0; background: #101820; color: #f2f2f2; font-family: sans-serif; }
  #wrap { position: relative; width: 960px; max-width: 100vw; margin: 0 auto; }
  canvas { display: block; width: 960px; max-width: 100vw; height: auto; background: #2a4a3a; }
  .hud { position: absolute; pointer-events: none; font-size: 14px; text-shadow: 1px 1px 2px #000; }
  #hud-stars { top: 8px; right: 12px; color: #ffd23f; font-size: 20px; }
  #hud-health { top: 8px; left: 12px; }
  #hud-money { top: 28px; left: 12px; color: #9be15d; }
  #hud-objective { bottom: 10px; left: 12px; right: 180px; }
  #hud-minimap { position: absolute; right: 12px; bottom: 12px; width: 150px; height: 150px; border: 2px solid #222; background: #1c2b22; }
  .menu { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,0.65); text-align: center; }
  .menu.active { display: flex; }
  .menu h1 { margin: 0 0 8px 0; font-size: 40px; letter-spacing: 1px; }
  .menu p { margin: 4px 0; }
  .menu button { margin-top: 12px; padding: 10px 22px; font-size: 16px; cursor: pointer; }
  #dialog { position: absolute; left: 50%; bottom: 170px; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid #555; padding: 10px 14px; display: none; max-width: 520px; }
  #dialog.active { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hud-health" class="hud">Health 100</div>
  <div id="hud-money" class="hud">$250</div>
  <div id="hud-stars" class="hud"></div>
  <div id="hud-objective" class="hud">Free roam in Solar Bay</div>
  <canvas id="hud-minimap" width="150" height="150"></canvas>
  <div id="dialog"></div>
  <div id="menu-title" class="menu active">
    <h1>Solar Bay: Outlaw</h1>
    <p>Top-down open-world crime in a seeded coastal city. Five missions for Mara Voss.</p>
    <p>WASD move, E enter car, Space punch, F shoot, Esc pause.</p>
    <button id="btn-start" type="button">Start</button>
    <button id="btn-continue" type="button">Continue</button>
  </div>
  <div id="menu-pause" class="menu">
    <h1>Paused</h1>
    <p>The bay waits for no outlaw.</p>
    <button id="btn-resume" type="button">Resume</button>
    <button id="btn-save" type="button">Save</button>
  </div>
  <div id="menu-busted" class="menu">
    <h1>Busted</h1>
    <p>The police caught you.</p>
    <button id="btn-busted" type="button">Respawn</button>
  </div>
  <div id="menu-wasted" class="menu">
    <h1>Wasted</h1>
    <p>You did not make it.</p>
    <button id="btn-wasted" type="button">Respawn</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
